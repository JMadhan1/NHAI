apply plugin: "com.android.application"
apply plugin: "kotlin-android"

android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.faceauthoffline"
    defaultConfig {
        applicationId "com.faceauthoffline"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }

    lintOptions {
        disable 'MissingTranslation', 'ExtraTranslation'
    }

    flavorDimensions "appType"
    productFlavors {
        regular {
            dimension "appType"
        }
    }
}

dependencies {
    // React Native
    implementation "com.facebook.react:react-native:0.73.6"
    implementation "com.facebook.react:react-android:0.73.6"

    // TensorFlow Lite
    implementation 'org.tensorflow:tensorflow-lite:2.11.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.3'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.11.0'
    implementation 'org.tensorflow:tensorflow-lite-gpu-delegates-gpu-only:0.4.3'

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.work:work-runtime-ktx:2.8.1'

    // Security
    implementation 'androidx.security:security-crypto-ktx:1.1.0-alpha06'

    // Kotlin
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4'

    // ML Kit
    implementation 'com.google.mlkit:face-detection:16.1.5'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

task copyDownloadableDepsToLibs(type: Copy) {
    from configurations.compile
    into "$buildDir/libs"
}

afterEvaluate {
    tasks.named("bundleReleaseJsAndAssets").configure {
        dependsOn copyDownloadableDepsToLibs
    }
}
